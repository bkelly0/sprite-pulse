steps:
  - name: gcr.io/cloud-builders/docker
    id: Build image
    args:
      - build
      - --build-arg
      - NEXT_ENABLE_PROXY=true
      - --build-arg
      - NEXT_GO_PRIVATE_BACKEND_URL=${_GO_BACKEND_URL}
      - --build-arg
      - GCP_BACKEND_AUTH_ENABLED=true
      - -f
      - apps/demo/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy to Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --service-account
      - ${_SERVICE_ACCOUNT}
      - --network
      - ${_VPC_NETWORK}
      - --subnet
      - ${_VPC_SUBNET}
      - --vpc-egress
      - ${_VPC_EGRESS}
      - --min-instances=0
      - --max-instances=1
      - --port
      - "80"
      - --set-env-vars
      - GCP_BACKEND_AUTH_ENABLED=true,NEXT_ENABLE_PROXY=true,NEXT_GO_PRIVATE_BACKEND_URL=${_GO_BACKEND_URL}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _AR_REPO: app-images
  _IMAGE_NAME: sprite-pulse-demo
  _SERVICE_NAME: sprite-pulse-demo
  _SERVICE_ACCOUNT:
  _VPC_NETWORK: demo-vpc
  _VPC_SUBNET: cloud-run-egress-subnet
  _VPC_EGRESS: all-traffic
  _GO_BACKEND_URL: