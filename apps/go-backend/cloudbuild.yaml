steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/go-backend:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/go-backend:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy to Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - gcr.io/$PROJECT_ID/go-backend:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --no-allow-unauthenticated
      - --ingress
      - internal-and-cloud-load-balancing
      - --port
      - "8080"
      - --network
      - ${_VPC_NETWORK}
      - --subnet
      - ${_VPC_SUBNET}
      - --vpc-egress
      - ${_VPC_EGRESS}

images:
  - gcr.io/$PROJECT_ID/go-backend:$SHORT_SHA

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: go-backend
  _VPC_NETWORK: demo-vpc
  _VPC_SUBNET: cloud_run_egress
  _VPC_EGRESS: private-ranges-only

